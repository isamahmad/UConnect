<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>UConnect</title>
<meta name="description" content="Private capital relationship platform">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#0D0C0B; --surface:#131210; --raised:#1A1815; --raised-2:#211E1A;
  --line:#28251F; --line-2:#3A352E;
  --ink:#EEE8DC; --ink-2:#B9B0A2; --ink-3:#877F73; --ink-4:#5E574E;
  --gold:#C9AE80; --gold-hi:#E7D6B2; --gold-lo:rgba(201,174,128,.10); --gold-mid:rgba(201,174,128,.28);
  --good:#8FB38B; --warn:#DCA65A; --crit:#D0705F; --info:#93AAC4;
  --good-lo:rgba(143,179,139,.12); --warn-lo:rgba(220,166,90,.12); --crit-lo:rgba(208,112,95,.13); --info-lo:rgba(147,170,196,.12);
  --f-display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --f-ui:"Jost","Futura","Avenir Next","Century Gothic","Segoe UI",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r-s:2px; --r-m:4px; --r-l:8px;
  --rail:232px; --top:64px;
  --shadow:0 24px 60px -20px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.5;letter-spacing:.005em;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--gold-hi);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
::selection{background:var(--gold-mid);color:var(--ink)}
:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
.num,td.num,.tnum{font-variant-numeric:tabular-nums lining-nums}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:0}
.muted{color:var(--ink-3)} .dim{color:var(--ink-2)}
.serif{font-family:var(--f-display)}
.eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.gold{color:var(--gold)}
h1,h2,h3,h4{margin:0;font-weight:500;text-wrap:balance}
.h-display{font-family:var(--f-display);font-weight:500;font-size:34px;line-height:1.1;letter-spacing:-.005em}
.h-section{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.2}
.h-card{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Gate ---------- */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(1200px 700px at 50% 38%,#1b1813 0%,var(--ground) 62%);overflow:auto;padding-inline:16px}
#gate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
.gate-card{position:relative;width:min(420px,100%);padding-block:40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.wordmark{font-family:var(--f-display);font-weight:500;font-size:56px;line-height:1;letter-spacing:.01em;background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 55%,#9C8358 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.wordmark i{font-style:italic;font-weight:400}
.gate-tag{font-family:var(--f-display);font-style:italic;font-size:18px;color:var(--ink-2);margin-top:-10px}
.gate-rule{width:56px;height:1px;background:var(--gold-mid)}
.gate-form{width:100%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.gate-label{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3)}
.code-input{background:transparent;border:0;border-bottom:1px solid var(--line-2);text-align:center;font-family:var(--f-mono);font-size:22px;letter-spacing:.42em;padding:10px 0 10px .42em;color:var(--gold-hi);border-radius:0;width:100%}
.code-input:focus{outline:none;border-bottom-color:var(--gold)}
.gate-msg{min-height:20px;font-size:13px;color:var(--crit)}
.gate-msg.ok{color:var(--ink-3)}
.gate-foot{font-size:11px;color:var(--ink-4);letter-spacing:.08em;max-width:320px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;width:100%}
.who{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .2s,background .2s}
.who:hover,.who:focus-visible{border-color:var(--gold-mid);background:var(--raised)}
.who .av{width:44px;height:44px;font-size:15px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-block:6px}
.pin-dots span{width:11px;height:11px;border-radius:50%;border:1px solid var(--gold-mid)}
.pin-dots span.on{background:var(--gold);border-color:var(--gold)}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:12px;justify-content:center}
.pinpad button{height:56px;border-radius:50%;background:transparent;border:1px solid var(--line-2);font-size:20px;font-weight:300;cursor:pointer;transition:background .15s,border-color .15s}
.pinpad button:hover{border-color:var(--gold-mid);background:var(--gold-lo)}
.pinpad button.ghost{border-color:transparent;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fade-in{animation:fadein .5s ease both}
@keyframes fadein{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Shell ---------- */
#app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr);min-height:100vh}
.rail{grid-row:1/3;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail-brand{height:var(--top);display:flex;align-items:center;padding-inline:24px;border-bottom:1px solid var(--line)}
.rail-brand .wordmark{font-size:28px}
.nav{display:flex;flex-direction:column;padding:18px 12px;gap:2px;overflow:auto;flex:1}
.nav-sep{margin:16px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-s);color:var(--ink-2);font-size:13.5px;letter-spacing:.02em;position:relative}
.nav a:hover{color:var(--ink);background:var(--raised);text-decoration:none}
.nav a.on{color:var(--gold-hi);background:var(--gold-lo)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:2px;background:var(--gold)}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.3}
.nav .badge{margin-left:auto}
.rail-foot{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:10px}
.me .who-name{font-size:13px}
.me .who-role{font-size:11px;color:var(--ink-3)}
.topbar{display:flex;align-items:center;gap:16px;padding-inline:28px;border-bottom:1px solid var(--line);background:rgba(13,12,11,.86);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
.topbar .page-title{font-family:var(--f-display);font-size:24px;font-weight:500;white-space:nowrap}
.topbar .grow{flex:1}
.gsearch{position:relative;width:min(380px,40vw)}
.gsearch input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 12px 8px 34px;font-size:13px}
.gsearch input:focus{outline:none;border-color:var(--gold-mid)}
.gsearch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.5}
.gsearch kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.gresults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r-m);box-shadow:var(--shadow);max-height:420px;overflow:auto;z-index:30;padding:6px}
.gresults a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-s);color:var(--ink)}
.gresults a:hover,.gresults a.sel{background:var(--gold-lo);text-decoration:none}
kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line-2);border-radius:3px;padding:1px 5px;color:var(--ink-3)}
.presence{display:flex;align-items:center}
.presence .av{width:28px;height:28px;font-size:11px;margin-left:-6px;box-shadow:0 0 0 2px var(--ground)}
.presence .live{width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:10px;box-shadow:0 0 0 3px var(--good-lo)}
main#view{padding:28px 28px 60px;min-width:0}
.tabbar{display:none}

/* ---------- Primitives ---------- */
.av{border-radius:50%;display:inline-grid;place-items:center;font-weight:500;letter-spacing:.04em;flex:none;width:32px;height:32px;font-size:12px;background:var(--raised-2);color:var(--gold-hi);border:1px solid var(--gold-mid)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:var(--r-s);border:1px solid var(--line-2);background:transparent;color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--gold-mid);background:var(--gold-lo)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#17130D;font-weight:500}
.btn.primary:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.ghost{border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--raised)}
.btn.danger{border-color:rgba(208,112,95,.45);color:#E7A091}
.btn.danger:hover{background:var(--crit-lo)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.icon{padding:7px;width:34px;height:34px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{background:none;border:0;cursor:pointer;color:var(--ink-2);padding:6px;border-radius:var(--r-s);position:relative;display:inline-grid;place-items:center}
.iconbtn:hover{color:var(--ink);background:var(--raised)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.4}
.iconbtn .dot{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--crit);color:#fff;font-size:9.5px;display:grid;place-items:center;padding-inline:3px;font-weight:600}
.badge{display:inline-flex;align-items:center;min-width:20px;height:18px;padding-inline:6px;border-radius:9px;font-size:10.5px;background:var(--raised-2);color:var(--ink-2);justify-content:center}
.badge.crit{background:var(--crit-lo);color:#E9A193}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding-inline:8px;border-radius:11px;border:1px solid var(--line-2);font-size:11.5px;color:var(--ink-2);white-space:nowrap;background:transparent}
.chip.gold{border-color:var(--gold-mid);color:var(--gold-hi);background:var(--gold-lo)}
.chip.good{border-color:rgba(143,179,139,.35);color:#B3CFAF;background:var(--good-lo)}
.chip.warn{border-color:rgba(220,166,90,.35);color:#E7C18C;background:var(--warn-lo)}
.chip.crit{border-color:rgba(208,112,95,.4);color:#EBA597;background:var(--crit-lo)}
.chip.info{border-color:rgba(147,170,196,.35);color:#B7C8DB;background:var(--info-lo)}
.chip.ex{border-style:dashed;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;flex:none;vertical-align:middle}
.chip .ic{width:12px;height:12px}
.stage-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.strength{display:inline-flex;gap:3px;align-items:center}
.strength i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.strength i.on{background:var(--gold)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel-b{padding:18px 20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.divider{height:1px;background:var(--line);margin-block:4px}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .h-section{color:var(--ink)}
.hint{font-size:12px;color:var(--ink-3)}
.sens{transition:filter .2s}
body.discreet .sens{filter:blur(6px);user-select:none}
body.discreet .sens:hover{filter:none}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead .sub{color:var(--ink-3);margin-top:6px;font-size:13px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;border:1px dashed var(--gold-mid);border-radius:var(--r-m);background:var(--gold-lo);margin-bottom:20px;font-size:13px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.input,select.input,textarea.input{width:100%;background:var(--ground);border:1px solid var(--line-2);border-radius:var(--r-s);padding:8px 10px;font-size:13.5px;min-width:0}
.input:focus{outline:none;border-color:var(--gold)}
textarea.input{resize:vertical;min-height:84px;line-height:1.55}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.input.sm{padding:6px 9px;font-size:12.5px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fgrid .span2{grid-column:1/-1}
.fsec{display:flex;flex-direction:column;gap:14px;padding-block:18px;border-bottom:1px solid var(--line)}
.fsec:last-child{border-bottom:0}
.fsec-title{font-family:var(--f-display);font-size:18px;color:var(--gold-hi)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{height:26px;padding-inline:10px;border-radius:13px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font-size:12px;cursor:pointer}
.pick button:hover{border-color:var(--gold-mid)}
.pick button.on{border-color:var(--gold);background:var(--gold-lo);color:var(--gold-hi)}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:13px;color:var(--ink-2)}
.check input{accent-color:var(--gold);width:15px;height:15px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-s);overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--gold-lo);color:var(--gold-hi)}
.drop{border:1px dashed var(--line-2);border-radius:var(--r-m);padding:28px 18px;text-align:center;color:var(--ink-3);cursor:pointer;transition:border-color .15s,background .15s;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--gold-lo);color:var(--ink-2)}
.drop strong{color:var(--ink);font-weight:500}

/* ---------- Tables ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer;transition:background .12s}
.t tbody tr:hover{background:var(--raised)}
.t tbody tr.nohover{cursor:default}
.t tbody tr.nohover:hover{background:none}
.t .name{font-weight:500;color:var(--ink)}
.t .org{font-size:12px;color:var(--ink-3)}
.t td.r,.t th.r{text-align:right}
.t input[type=checkbox]{accent-color:var(--gold)}
.cards{display:none}

/* ---------- KPIs & charts ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);margin-bottom:18px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--line)}
button.kpi{background:none;border:0;border-radius:0;text-align:left;font:inherit;color:inherit;cursor:pointer;position:relative;transition:background .15s}
button.kpi+button.kpi{border-left:1px solid var(--line)}
.kpi-link::after{content:"→";position:absolute;top:16px;right:18px;color:var(--gold);opacity:.35;transform:translateX(-3px);transition:opacity .15s,transform .15s}
.kpi-link:hover,.kpi-link:focus-visible{background:var(--gold-lo)}
.kpi-link:hover::after,.kpi-link:focus-visible::after{opacity:1;transform:none}
.kpi-link:focus-visible{outline:1px solid var(--gold);outline-offset:-1px}
.filled{background:var(--gold-lo)!important;border-color:var(--gold-mid)!important}
.pick.filled{background:none!important;outline:1px dashed var(--gold-mid);outline-offset:4px;border-radius:4px}
.kpi .v{font-family:var(--f-display);font-size:32px;line-height:1.05;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--ink-3)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(90px,130px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:12.5px}
.bar-row .lab{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:8px;background:var(--raised-2);border-radius:0 4px 4px 0;position:relative}
.bar-fill{height:100%;background:var(--gold);border-radius:0 4px 4px 0;min-width:2px}
.bar-fill.soft{background:var(--gold-mid)}
.bar-row .val{color:var(--ink);min-width:54px;text-align:right}
.bar-row:hover .bar-fill{background:var(--gold-hi)}
.progress{height:6px;background:var(--raised-2);border-radius:3px;overflow:hidden;display:flex;gap:2px}
.progress i{display:block;height:100%}
.progress i.c{background:var(--gold)}
.progress i.s{background:var(--gold-mid)}
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.alert:last-child{border-bottom:0}
.alert:hover{background:var(--raised)}
.alert .sev{align-self:stretch;border-radius:2px}
.sev.crit{background:var(--crit)} .sev.warn{background:var(--warn)} .sev.info{background:var(--info)} .sev.good{background:var(--good)}
.alert .t1{font-size:13.5px}
.alert .t2{font-size:12px;color:var(--ink-3)}
.feed{display:flex;flex-direction:column}
.feed-i{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:10px 20px;font-size:13px;border-bottom:1px solid var(--line)}
.feed-i:last-child{border-bottom:0}
.feed-i .av{width:28px;height:28px;font-size:10.5px}
.feed-i .when{font-size:11.5px;color:var(--ink-3)}

/* ---------- Deals ---------- */
.deal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.deal-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:border-color .2s,transform .2s}
.deal-card:hover{border-color:var(--gold-mid)}
.deal-card .dn{font-family:var(--f-display);font-size:22px;line-height:1.15}
.deal-card .figs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.deal-card .figs .v{font-size:15px;color:var(--ink)}
.stagecount{display:flex;gap:4px}
.stagecount span{flex:1;font-size:10.5px;color:var(--ink-3);text-align:center;padding:4px 0;border-top:2px solid var(--line-2)}
.stagecount span b{display:block;color:var(--ink);font-size:13px;font-weight:500}
.board{display:grid;grid-template-columns:repeat(5,minmax(185px,1fr)) minmax(150px,.75fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);display:flex;flex-direction:column;min-height:240px}
.col.over{border-color:var(--gold);background:var(--gold-lo)}
.col-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.col-h .row{justify-content:space-between}
.col-h .nm{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:500;display:flex;gap:8px;align-items:center}
.col-b{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.col.passed{opacity:.8}
.ecard{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.ecard:hover{border-color:var(--gold-mid)}
.ecard.dragging{opacity:.4}
.ecard .n{font-weight:500;font-size:13px}
.ecard .o{font-size:11.5px;color:var(--ink-3)}
.ecard .ns{font-size:11.5px;color:var(--ink-2)}
.ecard .foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-size:13px;color:var(--ink-3);cursor:pointer;border-bottom:1px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--gold-hi);border-bottom-color:var(--gold)}
.kv{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr);gap:9px 16px;font-size:13px}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding-bottom:14px;position:relative}
.tl::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:1px;background:var(--line-2)}
.tl:last-child::before{display:none}
.tl .pt{width:13px;height:13px;border-radius:50%;border:1px solid var(--gold);background:var(--ground);margin-top:3px}
.tl .pt.call{background:var(--gold-mid)} .tl .pt.meeting{background:var(--gold)}
.tl .meta{font-size:11.5px;color:var(--ink-3)}
.tl .body{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- Match ---------- */
.match-grid{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:20px;align-items:start}
.match-brief{position:sticky;top:calc(var(--top) + 20px)}
.steps{display:flex;flex-direction:column;gap:10px;padding:18px 20px}
.step{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--ink-3)}
.step .b{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex:none}
.step.on{color:var(--ink)} .step.on .b{border-color:var(--gold);animation:pulse 1.4s infinite}
.step.done{color:var(--ink-2)} .step.done .b{background:var(--gold);border-color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--gold-lo)}}
.result{display:grid;grid-template-columns:auto 56px minmax(0,1fr) auto;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line);align-items:start}
.result:last-child{border-bottom:0}
.result .rank{font-family:var(--f-display);font-size:20px;color:var(--ink-3);width:22px;padding-top:6px}
.score{width:56px;height:56px;position:relative;display:grid;place-items:center}
.score svg{position:absolute;inset:0;transform:rotate(-90deg)}
.score b{font-family:var(--f-display);font-size:21px;font-weight:500}
.result .rn{font-size:15px;font-weight:500}
.result ul{margin:8px 0 0;padding-left:16px;color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;gap:3px}
.result .caution{font-size:12.5px;color:#E7C18C;margin-top:6px}
.result .approach{font-size:12.5px;color:var(--ink-2);margin-top:8px;font-style:italic;font-family:var(--f-display);font-size:15px}
.result .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}

/* ---------- Overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,4,3,.62);backdrop-filter:blur(3px);z-index:40;animation:fadein .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);border-left:1px solid var(--line-2);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slidein .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:.001}to{transform:none;opacity:1}}
.drawer-h{padding:22px 26px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.drawer-b{flex:1;overflow:auto;padding:22px 26px 40px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100% - 32px));max-height:calc(100vh - 48px);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-l);z-index:45;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:fadein .22s}
.modal.wide{width:min(980px,calc(100% - 32px))}
.modal.narrow{width:min(460px,calc(100% - 32px))}
.modal-h{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-b{padding:6px 24px 20px;overflow:auto;flex:1}
.modal-f{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.menu{position:absolute;background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r-m);box-shadow:var(--shadow);padding:6px;z-index:35;min-width:220px}
.menu button,.menu a{display:flex;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:var(--r-s);font-size:13px;cursor:pointer;color:var(--ink);gap:10px;align-items:center}
.menu button:hover,.menu a:hover{background:var(--gold-lo);text-decoration:none}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:480px}
.toast{background:var(--raised-2);border:1px solid var(--line-2);border-left:2px solid var(--gold);padding:10px 16px;border-radius:var(--r-s);font-size:13px;box-shadow:var(--shadow);animation:fadein .25s;pointer-events:auto}
.toast.err{border-left-color:var(--crit)}
.lockveil{position:fixed;inset:0;z-index:55;background:rgba(9,8,7,.94);backdrop-filter:blur(14px);display:grid;place-items:center;padding-inline:16px}
.spin{width:16px;height:16px;border:1.5px solid var(--gold-mid);border-top-color:var(--gold);border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.meter{height:6px;background:var(--raised-2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold)}
.meter i.warn{background:var(--warn)}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(4){border-left:0}
  .kpi:nth-child(n+4){border-top:1px solid var(--line)}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .match-grid{grid-template-columns:minmax(0,1fr)}
  .match-brief{position:static}
}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr) auto}
  .rail{display:none}
  .topbar{padding-inline:16px;height:56px;gap:10px}
  .topbar .page-title{font-size:20px}
  .gsearch{width:auto;flex:1}
  .gsearch kbd,.presence .names{display:none}
  main#view{padding:18px 16px 96px}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:25;background:rgba(19,18,16,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;letter-spacing:.06em;color:var(--ink-3);padding:4px 6px;min-width:52px}
  .tabbar a.on{color:var(--gold-hi)}
  .tabbar a:hover{text-decoration:none}
  .tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.3}
  .g2,.g3,.g-main,.fgrid{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-left:0!important;border-top:1px solid var(--line)}
  .kpi:nth-child(-n+2){border-top:0}
  .kpi:nth-child(even){border-left:1px solid var(--line)!important}
  .kpi:last-child:nth-child(odd){grid-column:1/-1}
  .kpi .v{font-size:26px}
  .h-display{font-size:28px}
  .tablewrap.resp{display:none}
  .cards{display:flex;flex-direction:column;gap:10px}
  .ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
  .drawer-h,.drawer-b{padding-inline:18px}
  .result{grid-template-columns:48px minmax(0,1fr);gap:12px}
  .result .rank{display:none}
  .result .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
  .score{width:48px;height:48px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
  .bar-row{grid-template-columns:90px minmax(0,1fr) auto}
  .hide-m{display:none!important}
}
@media (min-width:861px){.show-m{display:none!important}}

/* ---------- Investor note ---------- */
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:28px 30px;max-width:940px}
.note .nhead{border-bottom:1px solid var(--gold-mid);padding-bottom:14px;margin-bottom:18px}
.note .nlede{font-family:var(--f-display);font-size:20px;line-height:1.35;color:var(--ink);margin:14px 0 0}
.nglance{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:22px;overflow:hidden}
.nglance>div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.nglance b{font-family:var(--f-display);font-size:19px;font-weight:500;overflow-wrap:anywhere}
.nsec{margin-bottom:22px}
.nsec h3{font-family:var(--f-display);font-size:19px;color:var(--gold-hi);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.nsec p{margin:0 0 8px;line-height:1.6}
.nnote{font-size:12px;color:var(--ink-3);margin-bottom:8px}
.nlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;line-height:1.55}
.nlist b{color:var(--ink)}
.nkv{grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:10px 18px;line-height:1.55}
.src{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);border:1px solid var(--line-2);border-radius:3px;padding:1px 4px;margin-left:6px;white-space:nowrap}
.src.ours{color:var(--gold);border-color:var(--gold-mid)}
.src.int{color:#CF6F5E;border-color:rgba(208,112,95,.4)}
.nverdict{background:var(--raised);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:var(--r-s);padding:14px 16px}
.nverdict p{margin:8px 0 0}
.nswing{font-size:13px;color:var(--ink-2)}
.nrisk td{vertical-align:top}
.nmatch{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.nfoot{margin-top:26px;border-top:1px solid var(--line);padding-top:12px;font-size:11.5px;color:var(--ink-3)}
.ndisc{margin-top:6px;font-size:11px;color:var(--ink-4);line-height:1.5}
.editable{outline:1px dashed var(--line-2);outline-offset:3px;border-radius:2px;cursor:text}
.editable:focus{outline:1px solid var(--gold);background:var(--gold-lo)}
@media (max-width:860px){.note{padding:20px 16px}.nglance{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div id="gate"></div>
<div id="app" hidden></div>
<div id="drawer"></div>
<div id="toasts" aria-live="polite"></div>
<script src="/app.js"></script></body></html>
